<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Cachimbo Radical</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
  <h1>Entrar</h1>
  <p class="tagline">Acesso reservado a quem escreve no Cachimbo Radical.</p>
  <form id="login-form">
    <div id="form-msg"></div>
    <label>Email
      <input type="email" name="email" required autocomplete="username">
    </label>
    <label>Palavra-passe
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>
</main>
<footer>Cachimbo Radical</footer>
<script type="module" src="assets/nav.js"></script>
<script type="module" src="assets/login.js"></script>
</body>
</html>
